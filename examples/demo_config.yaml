# =============================================================================
# Demo Config — handset telephony domain (강한 distortion 청취 검증용)
# NOT for training — training uses src/telephony_aug/config.yaml (probabilistic).
# =============================================================================
# Domain choice: 휴대폰 handset = 입 근접 사용 → reverb / packet_loss 거의 없음.
# 핵심 통화 distortion = "noisy environment + 강한 NS → 음성 over-suppression".
# Demo 는 noise_inject + 강한 NS + 저비트레이트 codec 위주, RIR/PLC 는 약화.

sample_rate: 48000

# Stage 0 — Very strong noise injection (SNR -3 ~ 3 dB → 잡음이 음성과 비슷하거나
# 더 큰 분포). NS 가 강제로 잡음을 깎아내야 하는 상황 → 음성도 같이 over-suppress.
noise_inject:
  prob: 1.0
  noise_dir: null                # synthetic 만 사용 (caller 가 noise_dir 주면 real noise)
  noise_type: [pink, brown]      # speech-band 위주의 자연스러운 노이즈 (white 보단 perceptual)
  snr_range: [-10, -5]           # 잡음 >> 음성 (5-10 dB 큼). NS 가 더 펌프 → 음성 잘림 강화
  dual_noise: false

# Stage A — RIR: 핸드셋 near-field 라 거의 없음 (handset dirac short-circuit)
rir:
  prob: 0.1                      # 거의 미발동 (배경 차원만 미세 반영)
  manifest_path: null
  rir_dir: null
  room_type_split:
    meeting: 0.0                 # handset 도메인 — meeting reverb 제외
    handset: 1.0                 # dirac identity (no reverb)
  wet_ratio_range: [0.1, 0.2]

# Stage B — Pre-codec WebRTC APM NS High (level 3 = WebRTC APM max).
# Multi-pass NS achieved via far_end_dsp stage activating WebRTC NS again
# after codec → "double NS" cascade artifact (전형적 핸드폰 분포).
near_end_dsp:
  prob: 1.0
  noise_suppression_range: [3, 3]   # WebRTC APM max = 3 (VeryHigh)
  auto_gain_range: [0, 3]

# Stage C — Codec (force VoIP Opus 12 kbps — low bitrate for audible artifacts)
codec:
  prob: 1.0
  category_probs:
    PSTN: 0.0
    Cellular: 0.0
    VoIP: 1.0
  codec_tree:
    PSTN:
      - {format: wav, encoder: pcm_mulaw, sr: 8000}
    Cellular:
      - {format: amr, encoder: libopencore_amrnb, sr: 8000, bitrate_modes_kbps: [4.75]}
    VoIP:
      - {format: opus, encoder: libopus, sr: 48000, bitrate_range_kbps: [12, 16]}

# Stage D+E — Packet loss: 핸드셋 도메인엔 잘 안 들림 (드물게만)
packet_loss_plc:
  prob: 0.1                       # 약화 — 사용자 도메인엔 dropout 별로 안 들림
  frame_size_ms: 20
  p_good_to_bad_range: [0.02, 0.05]
  p_bad_to_good_range: [0.5, 0.8]
  plc_weights: [0.7, 0.3]

# Stage F — Post-codec WebRTC APM cascade
far_end_dsp:
  prob: 1.0
  backend_weights: [1.0, 0.0, 0.0]   # webrtc / rnnoise / none

# Stage G — Force NB (8 kHz) — heaviest perceptual change
bandwidth_switch:
  prob: 1.0
  target_modes: [NB]
  target_weights: [1.0]

# Stage I — Mic capture: aggressive clipping + gain
mic_capture_cpu:
  prob: 1.0
  clip_prob: 1.0
  clip_threshold_range: [0.7, 0.85]
  gain_prob: 1.0
  gain_db_range: [-3, 3]

final_normalize:
  enabled: true
  target_peak: 0.95
