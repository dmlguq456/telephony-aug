[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telephony-aug"
version = "0.1.0"
description = "CPU-side telephony augmentation utility for ML training pipelines (PSTN/Cellular/VoIP codec + packet loss + DSP cascade + bandwidth limit + RIR)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "dmlguq456" },
]
keywords = [
    "audio",
    "augmentation",
    "speech",
    "telephony",
    "codec",
    "packet-loss",
    "rir",
    "voip",
    "g.711",
    "amr",
    "opus",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "soundfile>=0.10",
    "pyyaml>=5.1",
    "torchaudio>=2.1",
]

[project.optional-dependencies]
codec = [
    "opuslib>=3.0",
    "g711>=1.0",
    "g722>=0.1",
]
dsp = [
    "pyrnnoise>=0.2",
    "webrtc-noise-gain>=2.0",
]
rir = [
    "pyroomacoustics>=0.7",
]
audiomentations = [
    "audiomentations>=0.35",
]
eval = [
    "pesq",
]
dev = [
    "pytest>=7.0",
]
all = [
    "opuslib>=3.0",
    "g711>=1.0",
    "g722>=0.1",
    "pyrnnoise>=0.2",
    "webrtc-noise-gain>=2.0",
    "pyroomacoustics>=0.7",
    "audiomentations>=0.35",
    "pesq",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/dmlguq456/telephony-aug"
Repository = "https://github.com/dmlguq456/telephony-aug"
Issues = "https://github.com/dmlguq456/telephony-aug/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telephony_aug = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
